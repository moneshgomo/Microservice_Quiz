name: Docker CI/CD - Dev

on:
  push:
    branches:
      - dev 

permissions:
  contents: read

concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-dev:
    name: Build and push dev images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: service-registry
            context: ./service-registry
            dockerfile: ./service-registry/Dockerfile
            image_suffix: service-registry
            push_latest: "false"
          - name: question-service
            context: ./question-service
            dockerfile: ./question-service/Dockerfile
            image_suffix: question-service
            push_latest: "false"
          - name: quiz-service
            context: ./quiz-service
            dockerfile: ./quiz-service/Dockerfile
            image_suffix: quiz-service
            push_latest: "false"
          - name: api-gateway
            context: ./api-gateway
            dockerfile: ./api-gateway/Dockerfile
            image_suffix: api-gateway
            push_latest: "true"
          - name: frontend-quiz-app
            context: ./frontend-quiz-app
            dockerfile: ./frontend-quiz-app/Dockerfile
            image_suffix: frontend-quiz-app
            push_latest: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: prep
        shell: bash
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image_suffix }}"
          BRANCH_TAG="dev"
          SHA_TAG="dev-${GITHUB_SHA::7}"

          {
            echo "tags<<EOF"
            echo "${IMAGE}:${BRANCH_TAG}"
            echo "${IMAGE}:${SHA_TAG}"
            if [[ "${matrix.service.push_latest}" == "true" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            # Only pass secrets here, depending on the service
            ${{ 'SERVER_PORT=' + secrets.API_GATEWAY_SERVER_PORT if matrix.service.name == 'api-gateway' else '' }}
            ${{ 'FRONTEND_URL=' + secrets.FRONTEND_URL if matrix.service.name == 'api-gateway' else '' }}
            ${{ 'VITE_API_BASE_URL=' + secrets.VITE_API_BASE_URL if matrix.service.name == 'frontend-quiz-app' else '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service.name }}
            org.opencontainers.image.version=dev
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}