name: Production Promotion

on:
  push:
    branches:
      - main

jobs:
  promote:
    name: Promote Images to PROD
    runs-on: ubuntu-latest

    environment:
      name: production

    strategy:
      matrix:
        services: [service-registry, question-service, quiz-service, api-gateway, frontend-quiz-app]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Variables
        run: |
          echo "IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}" >> $GITHUB_ENV
          echo "VERSION_TAG=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Pull PREPROD Image
        run: |
          docker pull $IMAGE_NAME:preprod

      - name: Retag to PROD
        run: |
          docker tag $IMAGE_NAME:preprod $IMAGE_NAME:prod
          docker tag $IMAGE_NAME:preprod $IMAGE_NAME:${VERSION_TAG}

      - name: Push PROD Tags
        run: |
          docker push $IMAGE_NAME:prod
          docker push $IMAGE_NAME:${VERSION_TAG}