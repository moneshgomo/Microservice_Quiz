name: Devevelopment environment CI/CD

on:
  push:
    branches: [dev]

jobs:
  build-and-push-images:
    name: Build and Push Images ( DEV )
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        services: [service-registry, question-service, quiz-service, api-gateway, frontend-quiz-app]

      
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata
        id: meta
        run: |
          echo "SHA_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}" >> $GITHUB_ENV

      - name: Build and Push Image ( with cache )
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.services }}
          push: true
          tags: |
             ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
             ${{ env.IMAGE_NAME }}:dev
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Scan Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
          format: table
          exit-code: 0