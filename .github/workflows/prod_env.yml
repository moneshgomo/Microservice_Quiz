name: Docker CI/CD - Prod

on:
  push:
    branches:
      - prod
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: docker-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-prod:
    name: Build and push prod images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: service-registry
            context: ./service-registry
            dockerfile: ./service-registry/Dockerfile
            image_suffix: service-registry
            push_latest: "false"
            build_args: ""
          - name: question-service
            context: ./question-service
            dockerfile: ./question-service/Dockerfile
            image_suffix: question-service
            push_latest: "false"
            build_args: ""
          - name: quiz-service
            context: ./quiz-service
            dockerfile: ./quiz-service/Dockerfile
            image_suffix: quiz-service
            push_latest: "false"
            build_args: ""
          - name: api-gateway
            context: ./api-gateway
            dockerfile: ./api-gateway/Dockerfile
            image_suffix: api-gateway
            push_latest: "true"
            build_args: |
              SERVER_PORT=${{ secrets.API_GATEWAY_SERVER_PORT }}
              FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          - name: frontend-quiz-app
            context: ./frontend-quiz-app
            dockerfile: ./frontend-quiz-app/Dockerfile
            image_suffix: frontend-quiz-app
            push_latest: "true"
            build_args: |
              VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: prep
        shell: bash
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image_suffix }}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="prod-${GITHUB_SHA::7}"
          fi

          {
            echo "tags<<EOF"
            echo "${IMAGE}:${RELEASE_TAG}"
            if [[ "${{ matrix.service.push_latest }}" == "true" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: ${{ matrix.service.build_args }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service.name }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
