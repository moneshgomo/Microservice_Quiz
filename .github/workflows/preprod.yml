name: Pre-Prod Promotion

on:
  push:
    branches:
      - pre-prod

jobs:

  test:
  name: Run Unit Tests
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 🔹 Question Service
    - name: Test Question Service
      run: |
        cd question-service
        chmod +x mvnw
        ./mvnw clean test

    # 🔹 Quiz Service
    - name: Test Quiz Service
      run: |
        cd quiz-service
        chmod +x mvnw
        ./mvnw clean test
  promote:
    name: Promote Images to PREPROD
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        services: [service-registry, question-service, quiz-service, api-gateway, frontend-quiz-app]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}" >> $GITHUB_ENV

      - name: Pull DEV Image
        run: docker pull $IMAGE_NAME:dev

      - name: Retag to PREPROD
        run: docker tag $IMAGE_NAME:dev $IMAGE_NAME:preprod

      - name: Push PREPROD Tag
        run: docker push $IMAGE_NAME:preprod