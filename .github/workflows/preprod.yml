name: Pre-Prod Promotion

on:
  push:
    branches:
      - pre-prod

jobs:
  promote:
    name: Promote Images to PREPROD
    runs-on: ubuntu-latest

    strategy:
      matrix:
        services: [service-registry, question-service, quiz-service, api-gateway, frontend-quiz-app]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}" >> $GITHUB_ENV

      - name: Pull DEV Image
        run: |
          docker pull $IMAGE_NAME:dev

      - name: Retag to PREPROD
        run: |
          docker tag $IMAGE_NAME:dev $IMAGE_NAME:preprod

      - name: Push PREPROD Tag
        run: |
          docker push $IMAGE_NAME:preprod