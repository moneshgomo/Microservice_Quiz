{% extends "base.html" %}
{% block title %}Issue Book – RGCET Library{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4 gap-3">
  <h4 class="fw-bold mb-0">Issue a Book</h4>
</div>
<div class="card" style="max-width:520px">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Select Member <span class="text-danger">*</span></label>
        <select name="user_id" class="form-select" required>
          <option value="" disabled selected>— Choose member —</option>
          {% for u in users %}
          <option value="{{ u.id }}">{{ u.full_name }} ({{ u.username }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Select Book <span class="text-danger">*</span></label>
        <select name="book_id" class="form-select" required>
          <option value="" disabled selected>— Choose book —</option>
          {% for b in books %}
          <option value="{{ b.id }}">{{ b.title }} by {{ b.author }} ({{ b.available_copies }} left)</option>
          {% endfor %}
        </select>
      </div>
      <p class="text-muted small">Loan period: 14 days. Fine: ₹2/day after due date.</p>
      <button type="submit" class="btn btn-warning fw-bold">Issue Book</button>
    </form>
  </div>
</div>
{% endblock %}
