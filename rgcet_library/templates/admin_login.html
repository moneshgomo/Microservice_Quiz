<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin Login – RGCET Library</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <style>
    body { background:#1a2236; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-card { width:100%; max-width:420px; border-radius:14px; }
  </style>
</head>
<body>
<div class="login-card card p-4 shadow-lg">
  <div class="text-center mb-4">
    <span style="font-size:2.5rem">🔐</span>
    <h4 class="mt-2 fw-bold">Admin Login</h4>
    <p class="text-muted small">RGCET Library Management</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Username</label>
      <input type="text" name="username" class="form-control" placeholder="admin" required autofocus/>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn btn-warning w-100 fw-bold">Login as Admin</button>
  </form>
  <hr/>
  <p class="text-center small text-muted mb-0">
    <a href="{{ url_for('index') }}">← Back to Home</a>
  </p>
</div>
</body>
</html>
