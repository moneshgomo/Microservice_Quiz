<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register – RGCET Library</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <style>
    body { background:#f4f6fb; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { width:100%; max-width:480px; border-radius:14px; }
  </style>
</head>
<body>
<div class="card p-4 shadow">
  <div class="text-center mb-4">
    <span style="font-size:2.5rem">📝</span>
    <h4 class="mt-2 fw-bold">Create Account</h4>
    <p class="text-muted small">RGCET Library – Registration</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Full Name</label>
      <input type="text" name="full_name" class="form-control" required autofocus/>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Username</label>
      <input type="text" name="username" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" name="email" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" minlength="6" required/>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Role</label>
      <select name="role" class="form-select">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>
    </div>
    <button type="submit" class="btn btn-success w-100 fw-bold">Register</button>
  </form>
  <hr/>
  <p class="text-center small mb-0">
    Already have an account? <a href="{{ url_for('user_login') }}">Login</a>
  </p>
</div>
</body>
</html>
