{% extends "base.html" %}
{% block title %}Add Book – RGCET Library{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4 gap-3">
  <a href="{{ url_for('books') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
  <h4 class="fw-bold mb-0">Add New Book</h4>
</div>
<div class="card" style="max-width:580px">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" required autofocus/>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Author <span class="text-danger">*</span></label>
        <input type="text" name="author" class="form-control" required/>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">ISBN</label>
          <input type="text" name="isbn" class="form-control" placeholder="Optional"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Category</label>
          <input type="text" name="category" class="form-control" placeholder="e.g. Science"/>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Total Copies</label>
        <input type="number" name="total_copies" class="form-control" value="1" min="1" required/>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-primary fw-bold">Add Book</button>
    </form>
  </div>
</div>
{% endblock %}
